############################################################
#  MediaMTX — медиасервер для twich-analog
#
#  Запуск:  .\start-mediamtx.ps1
#  Документация по всем ключам: https://mediamtx.org/docs/
#
#  Полный список настроек (по умолчанию) лежит рядом:
#  tools/mediamtx/mediamtx.yml — смотрите его, если нужен
#  какой-то параметр, которого нет в этом файле.
############################################################

logLevel: info
logDestinations: [stdout]

############################################################
# HTTP API — по нему фронтенд узнаёт, какие потоки сейчас идут
# (кол-во зрителей, кодеки, время старта).
############################################################
api: yes
apiAddress: 127.0.0.1:9997
# Браузеру разрешено читать API только с этих адресов (CORS).
apiAllowOrigins: ["http://localhost:5173", "http://127.0.0.1:5173"]

############################################################
# RTMP — сюда публикует OBS (порт как у Twitch: 1935)
#   сервер: rtmp://127.0.0.1:1935/live
#   ключ:   stream   ->  путь потока "live/stream"
############################################################
rtmp: yes
rtmpAddress: :1935

############################################################
# HLS — «обычное» HTTP-видео (m3u8 + ts/fmp4).
# Работает везде, но задержка 4–10 секунд.
#   http://127.0.0.1:8888/live/stream/index.m3u8
############################################################
hls: yes
hlsAddress: :8888
hlsAllowOrigins: ["*"]
hlsVariant: lowLatency
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsSegmentCount: 7

############################################################
# WebRTC / WHEP — просмотр с задержкой меньше секунды.
#   http://127.0.0.1:8889/live/stream/whep
#
# webrtcAdditionalHosts нужен, если смотреть будут с другого
# компьютера/телефона: добавьте туда IP этого ПК в локальной
# сети (например, ["192.168.0.10"]).
############################################################
webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]
webrtcLocalUDPAddress: :8189
webrtcAdditionalHosts: []

############################################################
# RTSP и SRT — другие протоколы публикации/просмотра.
# Пригодятся для камер, ffmpeg, VLC.
############################################################
rtsp: yes
rtspAddress: :8554
srt: yes
srtAddress: :8890

# MoQ (Media over QUIC) в этом проекте не нужен — отключаем,
# чтобы не занимать порты 8892/8893 и не генерировать TLS-сертификаты.
moq: no

############################################################
# Пути потоков.
# all_others = «любое имя пути разрешено» — как каналы на
# Twitch: OBS публикует в live/<ключ>, плеер читает тот же путь.
############################################################
paths:
  all_others:

    # ── Запись эфира (VOD) ──────────────────────────────────
    # Раскомментируйте, чтобы каждый эфир писался на диск в
    # папку recordings/. ВНИМАНИЕ: файлы быстро занимают место.
    #
    # record: yes
    # recordPath: ./recordings/%path/%Y-%m-%d_%H-%M-%S
    # recordFormat: fmp4
    # recordSegmentDuration: 1h
    # recordDeleteAfter: 7d
